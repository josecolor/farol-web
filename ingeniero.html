<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Monitor técnico · El Farol al Día</title>
<link rel="icon" href="/static/favicon.png">
<style>
:root{--bg:#09090c;--card:#141418;--line:#25252d;--txt:#ece7de;--mut:#8f897f;--fuego:#ff5500;--ok:#2ecc71;--warn:#f5b50a;--bad:#ef4444;--off:#62626c}
@media(prefers-color-scheme:light){:root{--bg:#f4f2ee;--card:#fff;--line:#ddd8cf;--txt:#1b1a18;--mut:#6b655c}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;max-width:1100px;margin:auto}
h1{font-size:17px}h1 b{color:var(--fuego)}
main{max-width:1100px;margin:auto;padding:0 16px 24px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.wide{grid-column:1/-1}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sem{display:flex;align-items:center;gap:14px}
.luz{width:22px;height:22px;border-radius:50%;background:var(--off);flex:none}
[data-s=ok]>.luz,.luz[data-s=ok]{background:var(--ok);box-shadow:0 0 12px var(--ok)}
[data-s=warn]>.luz,.luz[data-s=warn]{background:var(--warn);animation:p 1.2s infinite}
[data-s=bad]>.luz,.luz[data-s=bad]{background:var(--bad);box-shadow:0 0 12px var(--bad)}
@keyframes p{50%{opacity:.35}}
.sem b{font-size:17px;display:block}.sem small{color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;word-break:break-word}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--off);color:#fff}
.pill.ok{background:var(--ok);color:#06210f}.pill.warn{background:var(--warn);color:#2a1f00}.pill.bad{background:var(--bad)}
.diag{margin-top:10px;padding:10px;border-radius:8px;background:rgba(239,68,68,.1);border:1px solid var(--bad);font-size:13px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.btn{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px 8px;min-height:44px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--fuego)}.btn.main{background:var(--fuego);border-color:var(--fuego);color:#fff}
.btn.bad{border-color:var(--bad);color:var(--bad)}.btn:disabled{opacity:.5;cursor:wait}
#log{font:12px/1.6 ui-monospace,Menlo,monospace;max-height:220px;overflow:auto;background:var(--bg);border-radius:8px;padding:10px}
#log .e{color:var(--bad)}#log .w{color:var(--warn)}#log div{white-space:pre-wrap;word-break:break-word}
.mut{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>🏮 Monitor técnico <b>· El Farol</b></h1>
  <div class="mut" style="display:flex;align-items:center;gap:10px"><span id="upd">—</span><button class="btn" id="btnRef" type="button" style="padding:6px 12px;min-height:36px">↻</button></div>
</header>
<main>
  <div class="card wide"><div class="sem" id="global" data-s="warn"><i class="luz"></i><div><b id="g-t">Verificando sistema…</b><small id="g-s">Consultando servicios</small></div></div></div>

  <div class="card"><h2>⚡ IA local (Ollama · qwen2.5:1.5b) <span class="pill" id="llm-p">…</span></h2>
    <div id="llm-kv"></div><div class="diag" id="llm-diag" hidden></div></div>

  <div class="card"><h2>🔎 Search Console <span class="pill" id="gsc-p">…</span></h2>
    <div id="gsc-kv"></div>
    <button class="btn main" id="btnGsc" type="button" style="width:100%;margin-top:10px">🔄 Sincronizar GSC ahora</button></div>

  <div class="card"><h2>🗄️ Bases de datos y colas</h2><div id="db-kv"></div></div>

  <div class="card"><h2>📰 Publicación</h2><div id="sys-kv"></div></div>

  <div class="card wide"><h2>⚙️ Acciones</h2>
    <div class="btns" id="acc">
      <button class="btn main" data-a="rss" type="button">📡 Procesar RSS</button>
      <button class="btn" data-g="Nacionales" type="button">🏛️ Nacionales</button>
      <button class="btn" data-g="Deportes" type="button">⚽ Deportes</button>
      <button class="btn" data-g="Economía" type="button">💰 Economía</button>
      <button class="btn" data-g="Tecnología" type="button">💻 Tecnología</button>
      <button class="btn" data-g="Internacionales" type="button">🌍 Internacionales</button>
      <button class="btn" data-g="Espectáculos" type="button">🎬 Espectáculos</button>
      <button class="btn" data-a="cache" type="button">🧹 Purgar caché</button>
      <button class="btn" data-a="ia-on" type="button">🟢 Activar generación</button>
      <button class="btn bad" data-a="ia-off" type="button">⏸ Pausar generación</button>
    </div></div>

  <div class="card wide"><h2>📋 Registro de actividad</h2><div id="log"><div class="mut">Monitor iniciado.</div></div></div>
</main>

<script>
(() => {
'use strict';
const PIN = '311';
const MOTOR = 'qwen2.5:1.5b';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
const pill = (id, cls, txt) => { const p = $(id); p.className = 'pill ' + cls; p.textContent = txt; };
const fecha = d => d ? new Date(d).toLocaleString('es-DO', { dateStyle: 'short', timeStyle: 'short' }) : '—';

async function api(url, opts = {}, ms = 10000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { credentials: 'same-origin', ...opts, signal: ctl.signal, headers: { 'Content-Type': 'application/json' } });
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
    return j;
  } catch (e) { return { error: e.name === 'AbortError' ? 'tiempo de espera agotado' : e.message }; }
  finally { clearTimeout(t); }
}
const post = (u, b, ms) => api(u, { method: 'POST', body: JSON.stringify({ pin: PIN, ...b }) }, ms);
function log(msg, c = '') {
  const b = $('log'); if (b.firstChild && b.firstChild.classList?.contains('mut')) b.innerHTML = '';
  const d = document.createElement('div'); if (c) d.className = c;
  d.textContent = `[${new Date().toLocaleTimeString('es-DO')}] ${msg}`; b.appendChild(d); b.scrollTop = b.scrollHeight;
}

const niveles = {};   // servicio → 'ok' | 'warn' | 'bad'
function global() {
  const v = Object.values(niveles);
  const s = v.includes('bad') ? 'bad' : v.includes('warn') ? 'warn' : v.length ? 'ok' : 'warn';
  $('global').dataset.s = s;
  $('g-t').textContent = s === 'ok' ? 'Todos los servicios operativos' : s === 'bad' ? 'Hay servicios con fallos' : 'Sistema degradado o calentando';
  $('g-s').textContent = Object.entries(niveles).filter(([, n]) => n !== 'ok').map(([k]) => k).join(' · ') || 'Sin incidencias';
}

async function llm() {
  const j = await api('/api/llm/status');
  let n, t;
  if (j.error && j.servicio_vivo === undefined) { n = 'bad'; t = 'Sin respuesta'; }
  else if (j.circuito === 'ABIERTO' || j.servicio_vivo === false) { n = 'bad'; t = 'Circuito abierto'; }
  else if ((j.instalados || []).length && !(j.instalados || []).some(m => m === MOTOR || m === MOTOR + ':latest')) { n = 'warn'; t = 'Falta ' + MOTOR; }
  else if (!j.precalentado) { n = 'warn'; t = 'Calentando'; }
  else { n = 'ok'; t = 'Saludable'; }
  niveles['IA local'] = n; pill('llm-p', n, t);
  $('llm-kv').innerHTML =
    kv('Servicio', esc(j.servicio || '—')) + kv('Conexión', j.servicio_vivo ? 'viva' : 'caída') +
    kv('Circuito', esc(j.circuito || '—')) + kv('Motor esperado', esc(MOTOR)) + kv('Modelo activo', esc(j.modelo_activo || '—')) +
    kv('Instalados', esc((j.instalados || []).join(', ') || '—')) +
    kv('Cola / ocupado', `${j.cola ?? 0} / ${j.ocupado ? 'sí' : 'no'}`) + kv('Generaciones', j.generadas ?? 0) +
    kv('Último OK', fecha(j.ultimo_ok)) + (j.ultimo_error ? kv('Último error', esc(String(j.ultimo_error).slice(0, 120))) : '');
  const dg = $('llm-diag'); dg.hidden = !j.diagnostico; dg.textContent = j.diagnostico ? '🔧 ' + j.diagnostico : '';
}
async function gsc() {
  const j = await api(`/api/gsc/status?pin=${PIN}`);
  let n, t;
  if (j.conectado) { n = 'ok'; t = 'Sincronizado'; } else if (j.error) { n = 'bad'; t = 'Error'; } else { n = 'warn'; t = 'Sin datos'; }
  niveles['Search Console'] = n; pill('gsc-p', n, t);
  $('gsc-kv').innerHTML = j.conectado
    ? kv('Última sincronización', fecha(j.ultima_sync)) + kv('Clics', Number(j.total_clics || 0).toLocaleString('es-DO')) +
      kv('Impresiones', Number(j.total_impresiones || 0).toLocaleString('es-DO')) + kv('CTR promedio', Number(j.ctr_promedio || 0).toFixed(2) + '%') +
      kv('Oportunidades / ganadoras', `${j.oportunidades_count ?? 0} / ${j.ganadoras_count ?? 0}`)
    : kv('Estado', esc(j.mensaje || j.error || 'Sin datos'));
}
async function bases() {
  const [est, cache] = await Promise.all([api('/api/estadisticas'), api('/api/cache/status')]);
  const pg = est.success ? 'ok' : 'bad';
  const r = String(cache.redis || ''), rn = r === 'conectado' ? 'ok' : r.startsWith('caido') ? 'bad' : 'warn';
  niveles['Postgres'] = pg; niveles['Redis'] = rn === 'bad' ? 'bad' : rn === 'warn' ? 'ok' : 'ok';
  const dot = n => `<span class="pill ${n}">${{ ok: 'OK', warn: 'Aviso', bad: 'Error', off: 'N/D' }[n]}</span>`;
  $('db-kv').innerHTML =
    kv('Postgres', dot(pg) + (est.success ? ` ${est.totalNoticias} noticias` : ' ' + esc(est.error || ''))) +
    kv('MongoDB', dot('off') + ' sin endpoint en el backend') +
    kv('Redis', dot(rn) + ' ' + esc(r || cache.error || '—')) +
    kv('Caché en memoria', (cache.memoria_entradas ?? '—') + ' entradas');
}
async function sistema() {
  const j = await api('/status');
  const n = j.error ? 'bad' : (j.min_sin_publicar > 360 ? 'warn' : 'ok');
  niveles['Publicación'] = n;
  $('sys-kv').innerHTML = j.error ? kv('Estado', esc(j.error)) :
    kv('Versión', esc(j.version)) + kv('Noticias publicadas', j.noticias) + kv('RSS procesados', j.rss_procesados) +
    kv('Minutos sin publicar', j.min_sin_publicar >= 9999 ? '—' : j.min_sin_publicar) + kv('Última noticia', esc(j.ultima_noticia)) +
    kv('Generación automática', j.ia_activa ? '<span class="pill ok">Activa</span>' : '<span class="pill warn">Pausada</span>');
}
async function todo() {
  $('upd').textContent = new Date().toLocaleTimeString('es-DO');
  await Promise.all([llm(), gsc(), bases(), sistema()]); global();
}

$('btnRef').onclick = todo;
$('btnGsc').onclick = async e => {
  const b = e.currentTarget; b.disabled = true; log('Sincronizando GSC…');
  const j = await post('/api/gsc/sync', {}, 120000);
  log(j.mensaje || j.error || 'Sin respuesta', j.success ? '' : 'e'); b.disabled = false; gsc().then(global);
};
$('acc').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  b.disabled = true;
  try {
    if (b.dataset.g) {
      log(`Generando "${b.dataset.g}" con ${MOTOR}…`);
      const j = await post('/api/generar-noticia', { categoria: b.dataset.g }, 15 * 60 * 1000);
      log(j.success ? `Publicada: ${j.titulo} (${j.redactor || 'redacción'})` : `Falló: ${j.error || 'sin detalle'}`, j.success ? '' : 'e');
    } else if (b.dataset.a === 'rss') {
      const j = await post('/api/procesar-rss', {}); log(j.mensaje || j.error, j.success ? '' : 'e');
    } else if (b.dataset.a === 'cache') {
      const j = await api('/api/cache/purgar', { method: 'POST', body: '{}' }); log(j.success ? 'Caché purgada' : j.error, j.success ? '' : 'e');
    } else {
      const on = b.dataset.a === 'ia-on', j = await post('/api/admin/config', { enabled: on });
      log(j.success ? (on ? 'Generación activada' : 'Generación pausada') : (j.error || 'No se pudo cambiar'), j.success ? (on ? '' : 'w') : 'e');
    }
  } finally { b.disabled = false; todo(); }
});

todo(); setInterval(todo, 30000);
})();
</script>
</body>
</html>
